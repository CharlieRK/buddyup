<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BuddyUp — web mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --surface-2:#EBF0F8;
  --ink:#14213D; --muted:#56627D; --line:#D3DAE8;
  --primary:#2F5BEA; --primary-ink:#FFFFFF; --primary-soft:#E4EBFF;
  --sun:#FFC93C; --sun-ink:#3A2A00; --ok:#147A52; --ok-soft:#DDF3EA;
  --danger:#B8283F; --danger-soft:#FBE3E7;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1220; --surface:#151E33; --surface-2:#1C2742;
    --ink:#E9EEF8; --muted:#A1ACC6; --line:#2C3858;
    --primary:#7D98FF; --primary-ink:#0C1220; --primary-soft:#22305A;
    --sun:#FFD25E; --sun-ink:#2A1F00; --ok:#4BCB94; --ok-soft:#173B2E;
    --danger:#FF7A8F; --danger-soft:#43202A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1220; --surface:#151E33; --surface-2:#1C2742;
  --ink:#E9EEF8; --muted:#A1ACC6; --line:#2C3858;
  --primary:#7D98FF; --primary-ink:#0C1220; --primary-soft:#22305A;
  --sun:#FFD25E; --sun-ink:#2A1F00; --ok:#4BCB94; --ok-soft:#173B2E;
  --danger:#FF7A8F; --danger-soft:#43202A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-0.015em}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .inner{max-width:1180px;margin:0 auto;padding:0 28px;height:68px;display:flex;align-items:center;gap:28px}
.brand{font-family:var(--display);font-weight:800;font-size:23px;background:none;border:0;padding:0;display:flex;align-items:center;gap:8px}
.brand .mark{display:inline-flex;gap:3px}
.brand .mark i{width:9px;height:9px;border-radius:50%;background:var(--primary)}
.brand .mark i:last-child{background:var(--sun)}
.navlinks{display:flex;gap:4px;flex:1}
.navlinks button{background:none;border:0;padding:8px 14px;border-radius:10px;color:var(--muted);font-weight:700;position:relative;min-height:44px}
.navlinks button[aria-current="true"]{color:var(--ink);background:var(--surface-2)}
.badge{background:var(--danger);color:#fff;font-size:11px;border-radius:10px;padding:0 6px;line-height:18px;margin-left:6px}
.right{display:flex;align-items:center;gap:12px}
.avatar-btn{border:0;padding:0;background:none;border-radius:50%}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:36px 28px 80px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}
.page-head h1{font-size:40px;font-weight:800;line-height:1.05}
.page-head p{margin:6px 0 0;color:var(--muted)}
.explore{display:grid;grid-template-columns:230px 1fr;gap:40px;align-items:start}
.filters{position:sticky;top:104px}
.filters h3{font-size:15px;margin:0 0 10px;font-family:var(--body);font-weight:700}
.filters .group{margin-bottom:26px}
.opt{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;text-align:left;padding:8px 10px;border-radius:10px;color:var(--muted);min-height:40px}
.opt[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 0 0 1.5px var(--line) inset}
.opt .sw{width:10px;height:10px;border-radius:3px;background:var(--c,var(--muted));flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:48px;align-items:start}
.sticky{position:sticky;top:104px}
.narrow{max-width:780px}

/* ---------- shared ---------- */
.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:700;min-height:46px;background:var(--primary);color:var(--primary-ink);white-space:nowrap}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sm{min-height:38px;padding:7px 14px;font-size:14px;border-radius:10px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:8px 0;min-height:40px;font-size:14px}
.back{background:none;border:0;color:var(--primary);font-weight:700;padding:6px 0;min-height:44px;display:inline-flex;align-items:center;gap:4px;margin-bottom:12px}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:24px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:24px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 18px;font-size:15px;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(20,33,61,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;min-height:38px;display:inline-flex;align-items:center;gap:7px}
.chip .sw{width:9px;height:9px;border-radius:3px;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface);font-weight:700}
.field{display:block;margin-bottom:18px}
.field>span{display:block;font-weight:700;font-size:14px;margin-bottom:7px}
.field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--surface);min-height:46px}
.field textarea{resize:vertical;min-height:96px}
.field.err input{border-color:var(--danger)}
.err-msg{color:var(--danger);font-size:13px;margin-top:6px;display:block}
.row{display:flex;gap:12px}
.row>*{flex:1}
.empty{text-align:center;padding:56px 16px;color:var(--muted);border:1.5px dashed var(--line);border-radius:20px}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:21px;margin-bottom:6px}
.tag{display:inline-block;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;margin:0 6px 8px 0}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ok);font-weight:700}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.avatar.sm{width:36px;height:36px;font-size:13px}

/* ---------- seats: the signature element ---------- */
.seats{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.seat{width:12px;height:12px;border-radius:50%;background:var(--primary);flex:none}
.seat.open{background:transparent;border:2px dashed var(--line)}
.seat.you{background:var(--sun);box-shadow:0 0 0 2px var(--ink) inset}
.seats.big{gap:10px}
.seats.big .seat{width:50px;height:50px;display:grid;place-items:center;color:var(--primary-ink);font-weight:700;font-size:15px}
.seats.big .seat.open{color:var(--muted);font-weight:400;font-size:22px}
.seats.big .seat.you{color:var(--sun-ink);box-shadow:none}
.seat.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* ---------- cards ---------- */
.card{display:flex;flex-direction:column;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:20px;min-height:186px}
.card:hover{border-color:var(--muted)}
.card-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:10px;gap:8px}
.cat{display:inline-flex;align-items:center;gap:7px;font-weight:700}
.cat::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.when{color:var(--muted)}
.card h3{font-size:20px;font-weight:700;line-height:1.2;margin-bottom:6px}
.card .where{font-size:14px;color:var(--muted);margin:0 0 16px}
.seat-line{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto}
.left{font-size:13px;font-weight:700;white-space:nowrap}
.left.few{background:var(--sun);color:var(--sun-ink);padding:2px 10px;border-radius:999px}
.left.full{color:var(--muted)}
.flag{font-size:12px;font-weight:700;color:var(--ok);background:var(--ok-soft);padding:2px 9px;border-radius:999px}

/* ---------- detail ---------- */
.detail h1{font-size:46px;font-weight:800;line-height:1.05;margin:10px 0 18px}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin:0 0 26px;padding:0;list-style:none;font-size:16px}
.facts li{display:flex;align-items:center;gap:8px}
.facts svg{width:19px;height:19px;color:var(--muted)}
.desc{font-size:18px;max-width:62ch;margin:0 0 28px}
.host{display:flex;gap:14px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;max-width:460px}
.host p{margin:0;font-size:14px;color:var(--muted)}
.side-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.side-h h2{font-size:20px}
.cta-zone{margin-top:22px;display:grid;gap:10px}
.status-note{background:var(--surface-2);border-radius:14px;padding:13px 15px;font-size:15px}
.chat{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;max-width:640px}
.msg{max-width:75%;padding:10px 14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line)}
.msg b{display:block;font-size:12px;color:var(--muted)}
.msg.me{align-self:flex-end;background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.msg.me b{color:inherit;opacity:.85}
.composer{display:flex;gap:10px;max-width:640px}
.composer input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:10px 18px;background:var(--surface);min-height:46px}

/* ---------- requests / admin / profile ---------- */
.req{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:18px;margin-bottom:12px}
.req p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.req blockquote{margin:10px 0 0;background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:15px}
.req .actions{display:flex;gap:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:28px}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px}
.stat b{display:block;font-family:var(--display);font-size:34px;font-weight:800;line-height:1.1}
.stat span{font-size:14px;color:var(--muted)}
.table-wrap{overflow-x:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:18px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:15px}
th,td{text-align:left;padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
.state{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.state.open{background:var(--sun);color:var(--sun-ink)}
.prof{display:grid;grid-template-columns:300px 1fr;gap:40px;align-items:start}
.prof .who{text-align:center}
.prof .who .avatar{width:96px;height:96px;font-size:32px;margin:0 auto 14px}
.prof .who h1{font-size:28px}

/* ---------- landing / auth ---------- */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center;padding:40px 0 64px}
.hero h1{font-size:68px;font-weight:800;line-height:.98;margin:0 0 22px}
.hero .lede{font-size:20px;color:var(--muted);max-width:34ch;margin:0 0 32px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.board{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:28px;padding:32px}
.board .hero-seats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.board .hero-seats span{aspect-ratio:1;border-radius:50%;border:2.5px dashed var(--line)}
.board .hero-seats span.f{border:0;background:var(--primary);animation:fill .4s ease-out both}
.board .hero-seats span.y{border:0;background:var(--sun);animation:fill .4s ease-out both}
@keyframes fill{from{transform:scale(0)}to{transform:scale(1)}}
.board .caption{margin-top:22px;display:flex;justify-content:space-between;align-items:center;font-size:15px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;border-top:1px solid var(--line);padding-top:40px}
.steps h3{font-size:20px;margin:8px 0 6px}
.steps p{margin:0;color:var(--muted)}
.steps .n{font-family:var(--display);font-weight:800;color:var(--primary);font-size:18px}
.auth{max-width:460px;margin:24px auto}
.auth h1{font-size:34px;margin-bottom:6px}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:14px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{transform:translate(-50%,0);opacity:1}
.jumper{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:13px;box-shadow:0 4px 14px rgba(20,33,61,.12)}
.jumper select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:920px){
  .explore,.two,.prof,.hero{grid-template-columns:1fr}
  .filters,.sticky{position:static}
  .hero h1{font-size:48px}
  .steps{grid-template-columns:1fr}
  .navlinks button{padding:8px 10px}
}
@media (max-width:640px){
  .topbar .inner{padding:0 16px;gap:12px}
  .navlinks{display:none}
  .wrap{padding:24px 16px 96px}
  .page-head h1,.detail h1{font-size:32px}
  .req{grid-template-columns:auto 1fr}
  .req .actions{grid-column:1/-1}
}
</style>
</head>
<body>
<header class="topbar"><div class="inner" id="topbar"></div></header>
<main class="wrap" id="screen"></main>
<div class="jumper"><label for="jump">Mockup screen</label><select id="jump"></select></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const ME='u1';
const CATS={'Sports':'#2F5BEA','Study':'#7A4FD6','Food':'#E07A1F','Arts & Culture':'#C2367A','Outdoors':'#178A5C','Gaming':'#0E8FA3','Other':'#6B7591'};
const users={
  u1:{name:'Haoran L.',major:'MS Computer Science',year:2027,interests:['Basketball','Hiking','Ramen','Board games']},
  u2:{name:'Mia Chen',major:'MS Data Science',year:2026},
  u3:{name:'Kevin Park',major:'BS Computer Science',year:2028},
  u4:{name:'Priya Nair',major:'MS Information Systems',year:2027},
  u5:{name:'Leo Martins',major:'MS Software Engineering',year:2026},
  u6:{name:'Sofia Rossi',major:'MBA',year:2027},
  u7:{name:'Dana Kim',major:'Student moderator',year:2026}
};
let acts=[
  {id:'a1',title:'Pickup basketball, 3 on 3',cat:'Sports',day:'today',when:'Today, 4:00 PM',where:'Rec center, court 2',cap:6,host:'u3',members:['u3','u5'],desc:'Casual game, all levels welcome. Bring a white and a dark shirt.',reqs:[]},
  {id:'a2',title:'Algorithms midterm study group',cat:'Study',day:'today',when:'Today, 7:00 PM',where:'Library, room 304',cap:5,host:'u2',members:['u2','u4'],desc:'Working through past exams for CS5800. Bring your practice problems.',reqs:[{u:ME,msg:'I’m in CS5800 too!',status:'pending'}]},
  {id:'a3',title:'Ramen night',cat:'Food',day:'week',when:'Fri, 6:30 PM',where:'Downtown food hall',cap:4,host:'u6',members:['u6','u2','u5'],desc:'Trying the new tonkotsu place. Splitting appetizers.',reqs:[]},
  {id:'a4',title:'Saturday morning hike',cat:'Outdoors',day:'week',when:'Sat, 9:00 AM',where:'Trailhead parking lot',cap:6,host:ME,members:[ME,'u4'],desc:'About 5 miles, moderate. I can drive 3 people from campus.',reqs:[{u:'u3',msg:'I have extra hiking poles if anyone needs them.',status:'pending'},{u:'u5',msg:'First hike here. Is it beginner friendly?',status:'pending'}]},
  {id:'a5',title:'Free day at the art museum',cat:'Arts & Culture',day:'week',when:'Sun, 1:00 PM',where:'City museum of art',cap:4,host:'u4',members:['u4'],desc:'New photography exhibit. Coffee after.',reqs:[]},
  {id:'a6',title:'Board game night',cat:'Gaming',day:'week',when:'Thu, 8:00 PM',where:'Student lounge',cap:8,host:'u5',members:['u5',ME,'u6'],desc:'Catan, Codenames, and whatever you bring.',reqs:[]},
  {id:'a7',title:'Tennis doubles',cat:'Sports',day:'week',when:'Sat, 10:00 AM',where:'South campus courts',cap:4,host:'u2',members:['u2','u3','u4','u6'],desc:'Intermediate level. Courts booked for 2 hours.',reqs:[]}
];
const chats={a6:[{u:'u5',t:'I’ll bring Catan and snacks.'},{u:'u6',t:'Can someone grab Codenames from the club room?'},{u:ME,t:'On it, I’ll pick it up at 7:30.'}],a4:[{u:'u4',t:'Is the parking lot free on weekends?'},{u:ME,t:'Yes, and it fills up by 10, so we’re good at 9.'}]};
let reports=[
  {id:'r1',type:'Activity',target:'“Selling textbooks cheap, DM me”',reason:'Spam',by:'Mia Chen',date:'Oct 27',status:'open'},
  {id:'r2',type:'User',target:'throwaway_2025',reason:'Harassment',by:'Priya Nair',date:'Oct 26',status:'open'},
  {id:'r3',type:'Activity',target:'“Late night party, bring cash”',reason:'Unsafe',by:'Leo Martins',date:'Oct 25',status:'open'}
];
const S={screen:'landing',act:'a1',tab:'about',cat:'All',date:'all',mine:'hosting',composing:false,signup:{},create:{},cap:4,manage:'a4',unread:0,newCat:'Sports'};
const SCREENS=[['landing','Welcome'],['signin','Log in'],['signup','Sign up'],['explore','Explore'],['detail','Activity detail'],['create','Create activity'],['mine','My activities'],['manage','Manage requests'],['profile','Profile'],['admin','Admin dashboard']];
const PUBLIC=['landing','signin','signup'];
const ic={
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2 .6 3 2.2 3.5 5"/></svg>',
  back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>'
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ini=id=>users[id].name.split(' ').map(w=>w[0]).join('').slice(0,2);
const first=id=>users[id].name.split(' ')[0];
const A=id=>acts.find(a=>a.id===id);
const myReq=a=>a.reqs.find(r=>r.u===ME&&r.status==='pending');
const spots=a=>a.cap-a.members.length;

function seats(a,big,popId){
  let h='';
  for(let i=0;i<a.cap;i++){
    const m=a.members[i];

function go(screen,id){

}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600);}
document.addEventListener('input',e=>{if(e.target.hasAttribute('data-preview')){const p=document.getElementById('preview');if(p)p.innerHTML=previewCard();}});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){go(g.dataset.go,g.dataset.id);return;}
  const b=e.target.closest('[data-action]');if(!b)return;
  const v=b.dataset.v,a=A(S.act);
  switch(b.dataset.action){
    case 'cat':S.cat=v;break;
    case 'date':S.date=v;break;
    case 'tab':S.tab=v;break;
    case 'mine':S.mine=v;break;
    case 'compose':S.composing=true;break;
    case 'cancelcompose':S.composing=false;break;
    case 'sendreq':{
      const msg=(document.getElementById('req-msg')||{}).value||'';
      a.reqs.push({u:ME,msg,status:'pending'});S.composing=false;toast(`Request sent to ${first(a.host)}`);
      const id=a.id;
      setTimeout(()=>{const x=A(id),r=myReq(x);if(!r||spots(x)<=0)return;r.status='approved';x.members.push(ME);S.pop=ME;if(S.screen!=='detail'||S.act!==id)S.unread++;toast(`${first(x.host)} approved your request`);render();},3500);
      break;}
    case 'withdraw':myReq(a).status='withdrawn';toast('Request withdrawn');break;
    case 'leave':a.members=a.members.filter(m=>m!==ME);S.tab='about';toast('You left the activity');break;
    case 'manage':S.manage=b.dataset.id;go('manage');return;
    case 'pickmanage':S.manage=v;break;
    case 'approve':{const m=A(S.manage);m.reqs.find(r=>r.u===v).status='approved';m.members.push(v);S.pop=v;toast(`${first(v)} is in`);break;}
    case 'decline':{const m=A(S.manage);m.reqs.find(r=>r.u===v).status='declined';toast(`Declined ${first(v)}’s request`);break;}
    case 'sendmsg':{const i=document.getElementById('chat-in');if(!i.value.trim())return;(chats[a.id]=chats[a.id]||[]).push({u:ME,t:i.value.trim()});break;}
    case 'report':toast('Thanks. A moderator will review this activity.');return;
    case 'newcat':case 'capdown':case 'capup':{
      if(b.dataset.action==='newcat')S.newCat=v;
      if(b.dataset.action==='capdown')S.cap=Math.max(2,S.cap-1);
      if(b.dataset.action==='capup')S.cap=Math.min(20,S.cap+1);
      const keep={};['c-title','c-date','c-time','c-where','c-desc'].forEach(id=>keep[id]=document.getElementById(id).value);
      render();Object.entries(keep).forEach(([id,val])=>document.getElementById(id).value=val);
      document.getElementById('preview').innerHTML=previewCard();return;}
    case 'create':{
      const val=id=>document.getElementById(id).value.trim();
      const t=val('c-title'),d=val('c-date'),w=val('c-where'),tm=val('c-time'),ds=val('c-desc');
      const err={};if(!t)err.title='Add a short title so people know what it is.';if(!d)err.date='Pick a date.';else if(new Date(d+'T'+(tm||'00:00'))<new Date())err.date='Pick a time in the future.';if(!w)err.where='Add where you’ll meet.';
      S.create=err;
      if(Object.keys(err).length){const keep={t,d,w,tm,ds};render();document.getElementById('c-title').value=keep.t;document.getElementById('c-date').value=keep.d;document.getElementById('c-where').value=keep.w;document.getElementById('c-time').value=keep.tm;document.getElementById('c-desc').value=keep.ds;document.getElementById('preview').innerHTML=previewCard();return;}
      const dt=new Date(d+'T'+tm),id='a'+(acts.length+1);
      acts.push({id,title:t,cat:S.newCat,day:'week',when:dt.toLocaleDateString('en-US',{weekday:'short'})+', '+dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}),where:w,cap:S.cap,host:ME,members:[ME],desc:ds||'No details yet.',reqs:[]});
      S.create={};S.cap=4;toast('Activity posted');go('detail',id);return;}
    case 'signup':{
      const em=document.getElementById('su-email').value.trim(),pw=document.getElementById('su-pw').value,err={};
      if(!/@northeastern\.edu$/i.test(em))err.email='Use your @northeastern.edu email address.';
      if(pw.length<8)err.pw='Use at least 8 characters.';
      S.signup=err;if(Object.keys(err).length){render();return;}
      S.signup={};toast('Account created. Welcome to BuddyUp!');go('explore');return;}
    case 'signin':S.loginErr=false;go('explore');return;
    case 'badlogin':S.loginErr=true;break;
    case 'mod':{const r=reports.find(x=>x.id===v);r.status=b.dataset.s;toast({dismissed:'Report dismissed',removed:'Activity removed',suspended:'User suspended'}[r.status]);break;}
    case 'toast':toast(v);return;
  }
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chat-in')document.querySelector('[data-action="sendmsg"]').click();});
const jump=document.getElementById('jump');
jump.innerHTML=SCREENS.map(([k,l])=>`<option value="${k}">${l}</option>`).join('');
jump.addEventListener('change',()=>go(jump.value));
const h=location.hash.slice(1);if(SCREENS.some(([k])=>k===h))S.screen=h;
render();
</script>
